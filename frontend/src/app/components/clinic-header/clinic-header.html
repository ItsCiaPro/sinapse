<header class="patient-header">
  <div class="patient-header-wrapper">
    <div class="patient-header-top">
      <span class="patient-header-label">{{ title }}</span>
      <span class="patient-header-status">Ativo</span>
    </div>
    <div class="patient-header-row">
      <div class="patient-identity">
        <img src="imgs/logo_filled.svg" alt="Identidade da clínica" class="patient-avatar">
        <div class="patient-name-block">
          <h1 class="patient-name">{{ clinicName }}</h1>
          <p class="patient-sub">Espaço da clínica · Demonstração</p>
        </div>
      </div>
      <div class="patient-tags">
        <span class="tag tag--indigo"><span class="tag-dot"></span>Equipe</span>
        <span class="tag tag--amber"><span class="tag-dot"></span>Atendimentos</span>
      </div>
    </div>
  </div>
</header>
