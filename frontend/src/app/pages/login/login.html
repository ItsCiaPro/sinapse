<body>

   <div class="container">
      <h2>Entrar</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
         </div>

         <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha" required>
         </div>

         <div class="forgot-password">
            <a href="#">Esqueceu a senha?</a>
         </div>

         <button type="submit" [disabled]="loading || !loginForm.valid" class="btn">Entrar</button>

         <p class="login-link">
            Ainda não tem uma conta? <a routerLink="/register">Cadastre-se</a>
         </p>
      </form>
   </div>

</body>
