<body>

   <div class="container">
      <div class="logo">
         <img src="imgs/logo_filled.svg" width="30px" alt="">
         <h1>Sinapse</h1>
      </div>

      <h2>Faça Login</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
         </div>

         <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha"
               required>
         </div>

         <button type="submit" [disabled]="loading || !loginForm.valid" class="btn">Entrar</button>

         <p class="login-link">
            Ainda não tem uma conta? <a routerLink="/register">Cadastre-se</a>
         </p>
      </form>

      <div class="lgpd_container">
         <p> Seus dados de saúde, laudos e histórico de consultas protegidos com padrão hospitalar e sigilo médico
            absoluto. </p>
      </div>
   </div>

</body>
