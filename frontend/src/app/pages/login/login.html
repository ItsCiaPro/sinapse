<body>

   <div class="container">
      <div class="logo">
         <img src="imgs/logo_filled.svg" width="30px" alt="">
         <h1>Sinapse</h1>
      </div>

      <h2>Faça Login</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
         <fieldset class="account-types">
            <legend>Escolha seu espaço</legend>
            <label class="account-option" [class.selected]="selectedRole === 'patient'">
               <input type="radio" name="accountRole" value="patient" [(ngModel)]="selectedRole" required>
               <span><strong>Paciente</strong><small>Meu histórico e carteirinhas</small></span>
            </label>
            <label class="account-option" [class.selected]="selectedRole === 'clinic'">
               <input type="radio" name="accountRole" value="clinic" [(ngModel)]="selectedRole" required>
               <span><strong>Clínica</strong><small>Profissionais e atendimentos</small></span>
            </label>
         </fieldset>
         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
         </div>

         <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha"
               required>
         </div>

         <button type="submit" [disabled]="loading || !loginForm.valid || !selectedRole" class="btn">Entrar</button>
         <p class="demo-note">A escolha do espaço é local. O e-mail e a senha precisam pertencer a uma conta válida do Supabase.</p>

         <p class="login-link">
            Ainda não tem uma conta? <a routerLink="/register">Cadastre-se</a>
         </p>
      </form>

   </div>

</body>
