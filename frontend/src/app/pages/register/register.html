<body>
   <div class="container">
      <h2>Criar Conta</h2>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
         </div>

         <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha" required>
         </div>

         <div class="input-group">
            <label for="passwordConfirm">Confirmar Senha</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" [(ngModel)]="passwordConfirm" placeholder="Confirme sua senha"
               required>
         </div>

         <button type="submit" [disabled]="loading || !registerForm.valid" class="btn">Cadastrar</button>

         <p class="login-link">
            Já tem uma conta? <a routerLink="/login">Faça login</a>
         </p>
      </form>

      @if (toastMessage !== '') {
         <p>{{ toastMessage }}</p>
      }
   </div>
</body>
