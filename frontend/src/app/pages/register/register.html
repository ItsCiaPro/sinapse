<body>
   <div class="container">
      <div class="logo">
         <img src="imgs/logo_filled.svg" width="30px" alt="">
         <h1>Sinapse</h1>
      </div>

      <h2>Criar Conta</h2>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

         <fieldset class="account-types">
            <legend>Como você vai usar o Sinapse?</legend>
            <div class="account-switch" [class.clinic-selected]="selectedRole === 'clinic'">
            <label class="account-option">
               <input type="radio" name="accountRole" value="patient" [(ngModel)]="selectedRole" required>
               <span>Paciente</span>
            </label>
            <label class="account-option">
               <input type="radio" name="accountRole" value="clinic" [(ngModel)]="selectedRole" required>
               <span>Clínica</span>
            </label>
            </div>
         </fieldset>

         @if (selectedRole === 'clinic') {
         <div class="input-group">
            <label for="clinicName">Nome da clínica</label>
            <input type="text" id="clinicName" name="clinicName" [(ngModel)]="clinicName" placeholder="Ex.: Clínica Horizonte" required maxlength="80">
         </div>
         }

         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail" required>
         </div>

         <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha" required>
         </div>

         <div class="input-group">
            <label for="passwordConfirm">Confirmar Senha</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" [(ngModel)]="passwordConfirm" placeholder="Confirme sua senha"
               required>
         </div>

         <div class="terms-group">
            <input id="acceptTerms" type="checkbox" name="acceptTerms" [(ngModel)]="acceptedTerms" required>
            <label for="acceptTerms">Ao criar uma conta, concordo com o uso das minhas informações para criar e acessar minha conta e declaro ter lido a <a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm" target="_blank" rel="noopener noreferrer">Lei Geral de Proteção de Dados (LGPD)</a>.</label>
         </div>

         <button type="submit" [disabled]="loading || !registerForm.valid || !acceptedTerms || !selectedRole" class="btn">Cadastrar</button>
         <p class="demo-note">O tipo de conta é uma simulação salva neste navegador. O cadastro com e-mail e senha continua no Supabase.</p>

         <p class="login-link">
            Já tem uma conta? <a routerLink="/login">Faça login</a>
         </p>
      </form>

      @if (toastMessage !== '') {
         <p>{{ toastMessage }}</p>
      }
   </div>
</body>
